<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="healsphere.css">
</head>
<body>
    <header>
        <div id="navbar">
            <img src="logo.png" alt="HealSphere Logo">

            <div class="searchbar">
                <input type="text" id="searchbar" placeholder="Search here...">
                <button id="searchbtn">Search</button>
            </div>
            <div class="location">
                <a href="https://www.google.com/maps">Location</a>
            </div>

            <div class="loginhome">
                <a href="Login.html"><button>Login</button></a>
            </div>
        </div>
    </header>
        <div class="appointment-wrapper signup-wrapper">
            <div class="appointment-image">
                <img src="main2.png" alt="doctor image">
            </div>

            <form class="appointmentform signup-form">
                <h2>Join HealSphere</h2>

                <div class="form-row">
                    <label for="Name">Name</label>
                    <input type="text" id="Name" name="Name" placeholder="Your full name" required>
                </div>

                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="mail" placeholder="you@example.com" required>
                </div>

                <div class="form-row form-row--two">
                    <div class="col">
                        <label for="age">Age</label>
                        <input type="number" id="age" name="Age" min="18" required>
                    </div>
                    <div class="col">
                        <label for="contact">Contact</label>
                        <input type="tel" id="contact" name="contact" placeholder="123-456-7890" required>
                    </div>
                </div>

                <div class="form-row">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password" required>
                </div>

                <div class="form-row">
                    <input type="submit" value="Sign Up" class="appointment-submit">
                </div>

            </form>
        </div>
        <footer>
<div class="footer-content">
    <p> 2024 HealSphere. All rights reserved.</p>
    <div class="social-media">
        <img src="facebook.png" alt="Facebook" class="social-icon">
        <img src="twitter.png" alt="Twitter" class="social-icon">
        <img src="insta.png" alt="Instagram" class="social-icon">
    </div>
<div><p>HealSphere services are only available in the U.S. <br>The information provided on this website is not intended for consumers outside of the U.S.©2025 1Life Healthcare, Inc. All rights reserved.</p></div>
</footer>
</body>
</html>
